[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "goatee"
version = "0.2.0"
description = "Spec and delivery control layer for AI-assisted software changes."
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
goatee = "goatee.cli:main"

[tool.setuptools.packages.find]
where = ["."]
