name: GoATee Verification & CI Governance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    name: Verify Specification & Delivery
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute GoATee CI Governance (Pull Request)
        if: github.event_name == 'pull_request'
        run: |
          python3 -m goatee.cli ci --allow-needs-review

      - name: Verify Trunk Integrity & Project Health (Post-Merge Main)
        if: github.event_name == 'push'
        run: |
          python3 -m unittest discover tests
          python3 -m goatee.cli status

      - name: Generate HTML Delivery Certificate
        if: always()
        run: |
          python3 -m goatee.cli cert || true

      - name: Upload HTML Delivery Certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goatee-delivery-certificates
          path: .goatee/certificates/*.html
          if-no-files-found: ignore
